version: '3.8'

services:
  baahubali-redis:
    image: redis:7-alpine
    container_name: baahubali-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_prod_data:/data
    networks:
      - backend-network

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: api-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
      - ./api-gateway/.env
    networks:
      - backend-network
    depends_on:
      - baahubali-redis

  iam-service:
    build:
      context: .
      dockerfile: iam-service/Dockerfile
    container_name: iam-service
    restart: unless-stopped
    env_file:
      - .env
      - ./iam-service/.env
    networks:
      - backend-network
    depends_on:
      - baahubali-redis

  # test-service:
  #   build:
  #     context: .
  #     dockerfile: test-service/Dockerfile
  #   container_name: test-service
  #   restart: unless-stopped
  #   env_file:
  #     - .env
  #     - ./test-service/.env
  #   networks:
  #     - backend-network
  #   depends_on:
  #     - baahubali-redis

networks:
  backend-network:
    driver: bridge

volumes:
  redis_prod_data: