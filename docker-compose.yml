version: '3.8'

services:
  baahubali-redis:
    image: redis:7-alpine
    container_name: baahubali-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_prod_data:/data
    networks:
      - backend-network

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: api-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
      - ./api-gateway/.env
    networks:
      - backend-network
    depends_on:
      - baahubali-redis

  iam-service:
    build:
      context: .
      dockerfile: iam-service/Dockerfile
    container_name: iam-service
    restart: unless-stopped
    env_file:
      - .env
      - ./iam-service/.env
    networks:
      - backend-network
    depends_on:
      - baahubali-redis

  # test-service:
  #   build:
  #     context: .
  #     dockerfile: test-service/Dockerfile
  #   container_name: test-service
  #   restart: unless-stopped
  #   env_file:
  #     - .env
  #     - ./test-service/.env
  #   networks:
  #     - backend-network
  #   depends_on:
  #     - baahubali-redis
  swagger-ui:
      image: swaggerapi/swagger-ui
      container_name: platform-swagger-ui
      restart: unless-stopped
      ports:
        - "8081:8080"
      environment:
        URLS: "[{ url: 'http://localhost:8080/api/auth/v3/api-docs', name: 'IAM Service' }]"
      networks:
        - backend-network

networks:
  backend-network:
    driver: bridge

volumes:
  redis_prod_data: