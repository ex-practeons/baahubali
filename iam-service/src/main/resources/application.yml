server:
  port: 8081

spring:
  application:
    name: iam-service
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:baahubali}?sslMode=DISABLED&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      # Use Flyway/Liquibase for schema management in production instead of ddl-auto.
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    url: jdbc:mysql://localhost:3306/baahubali?sslMode=DISABLED&allowPublicKeyRetrieval=true
    user: root
    password: root

app:
  jwt:
    # MUST be overridden via env var in every real environment — this default is for local dev only.
    secret: ${JWT_SECRET:CHANGE_ME_TO_A_LONG_RANDOM_BASE64_ENCODED_SECRET_AT_LEAST_256_BITS_LONG}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
    cookie-name: ACCESS_TOKEN
    cookie-domain: ${COOKIE_DOMAIN:}
    cookie-secure: ${COOKIE_SECURE:true}
    cookie-same-site: ${COOKIE_SAME_SITE:Strict}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
