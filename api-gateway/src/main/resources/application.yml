server:
  port: 8080

spring:
  application:
    name: api-gateway
  config:
    import: optional:file:.env[.properties]
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 500ms
  cloud:
    gateway:
      server:
        webflux:
          routes:
          - id: iam-auth
            uri: ${IAM_SERVICE_URL:http://localhost:8081}
            predicates:
              - Path=/api/auth/**
            filters:
              - name: RequestRateLimiter
                args:
                  key-resolver: "#{@userOrIpKeyResolver}"
                  redis-rate-limiter.replenishRate: 1
                  redis-rate-limiter.burstCapacity: 60
                  redis-rate-limiter.requestedTokens: 3

          - id: iam-users
            uri: ${IAM_SERVICE_URL:http://localhost:8081}
            predicates:
              - Path=/api/users/**
            filters:
              - name: RequestRateLimiter
                args:
                  key-resolver: "#{@userOrIpKeyResolver}"
                  redis-rate-limiter.replenishRate: 10
                  redis-rate-limiter.burstCapacity: 20
                  redis-rate-limiter.requestedTokens: 1

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: IAM Service
        url: /api/auth/v3/api-docs
      - name: Exam Engine
        url: /api/exams/v3/api-docs

gateway:
  security:
    public-paths:
      - /api/auth/login
      - /api/auth/register
      - /swagger-ui.html
      - /swagger-ui/**
      - /v3/api-docs/**
      - /api/auth/v3/api-docs
      - /api/exams/v3/api-docs
      - /webjars/**
    jwt:
      secret: ${JWT_SECRET:MTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTI}
      cookie-name: jwt_token
      user-id-claim: sub
      role-claim: role
      issuer: ${JWT_ISSUER:}
      clock-skew-seconds: 30

rate-limit:
    trusted-proxy-count: ${TRUSTED_PROXY_COUNT:0}