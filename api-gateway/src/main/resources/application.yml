server:
  port: 8080

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "${CORS_ALLOWED_ORIGINS:http://localhost:3000}"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
      server:
        webflux:
          routes:
            - id: iam-service-auth
              uri: ${IAM_SERVICE_URL:http://localhost:8080}
              predicates:
                - Path=/api/auth/**
            - id: iam-service-users
              uri: ${IAM_SERVICE_URL:http://localhost:8080}
              predicates:
                - Path=/api/users/**
            - id: test-service
              uri: ${TEST_SERVICE_URL:http://localhost:8080}
              predicates:
                - Path=/api/tests/**

logging:
  level:
    org.springframework.cloud.gateway: TRACE

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: IAM Service
        url: /api/auth/v3/api-docs
      - name: Test Service
        url: /api/tests/v3/api-docs

gateway:
  security:
    public-paths:
      - /api/auth/login
      - /api/auth/register
      - /api/*/swagger-ui.html
      - /api/*/swagger-ui/**
      - /api/*/v3/api-docs
      - /api/*/v3/api-docs/**
      - /api/*/webjars/**
      - /swagger-ui.html
      - /swagger-ui/**
      - /v3/api-docs/**
      - /webjars/**
    jwt:
      secret: ${JWT_SECRET:MTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTI}
      cookie-name: ACCESS_TOKEN
      user-id-claim: sub
      role-claim: role
      issuer: ${JWT_ISSUER:}
      clock-skew-seconds: 30