server:
  port: 8080

spring:
  application:
    name: api-gateway
  config:
    import: optional:file:.env[.properties]
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: iam-service
              uri: ${IAM_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/auth/**, /api/users/**
            - id: exam-engine
              uri: ${EXAM_ENGINE_URL:http://localhost:8082}
              predicates:
                - Path=/api/exams/**

gateway:
  security:
    public-paths:
      - /api/auth/login
      - /api/auth/register
    jwt:
      secret: ${JWT_SECRET}
      cookie-name: jwt_token
      user-id-claim: sub
      role-claim: role
      issuer: ${JWT_ISSUER:}
      clock-skew-seconds: 30