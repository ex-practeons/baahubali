server:
  port: 8080

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "${CORS_ALLOWED_ORIGINS:http://localhost:3000}"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
      server:
        webflux:
          routes:
            - id: iam-service
              uri: ${IAM_SERVICE_URL:http://localhost:8080}
              predicates:
                - Path=/auth-api/**
            - id: test-service
              uri: ${TEST_SERVICE_URL:http://localhost:8080}
              predicates:
                - Path=/tests-api/**
            - id: attempt-service
              uri: ${ATTEMPT_SERVICE_URL:http://localhost:8080}
              predicates:
                - Path=/attempts-api/**

logging:
  level:
    org.springframework.cloud.gateway: TRACE

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: IAM Service
        url: /auth-api/v3/api-docs
      - name: Test Service
        url: /tests-api/v3/api-docs
      - name: Attempts Service
        url: /attempts-api/v3/api-docs

gateway:
  security:
    public-paths:
      # IAM public endpoints
      - /auth-api/login
      - /auth-api/register

      # Public APIs exposed through services
      - /tests-api/public/**

      # Swagger / OpenAPI through Gateway
      - /auth-api/swagger-ui.html
      - /auth-api/swagger-ui/**
      - /auth-api/v3/api-docs
      - /auth-api/v3/api-docs/**
      - /auth-api/webjars/**

      - /tests-api/swagger-ui.html
      - /tests-api/swagger-ui/**
      - /tests-api/v3/api-docs
      - /tests-api/v3/api-docs/**
      - /tests-api/webjars/**

      - /attempts-api/swagger-ui.html
      - /attempts-api/swagger-ui/**
      - /attempts-api/v3/api-docs
      - /attempts-api/v3/api-docs/**
      - /attempts-api/webjars/**

      # Gateway's own Swagger UI
      - /swagger-ui.html
      - /swagger-ui/**
      - /v3/api-docs/**
      - /webjars/**
    jwt:
      secret: ${JWT_SECRET:MTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTI}
      cookie-name: ACCESS_TOKEN
      user-id-claim: sub
      role-claim: role
      issuer: ${JWT_ISSUER:}
      clock-skew-seconds: 30